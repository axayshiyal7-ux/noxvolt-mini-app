<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoxVolt Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body{background:#080a0f;color:#f5f7fb;font:15px/1.5 system-ui;margin:0;padding:16px;max-width:600px;margin:auto}
  h1{font-size:20px}
  .card{border:1px solid #293241;background:#11151d;border-radius:14px;padding:14px;margin:10px 0}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .muted{color:#9ba7b8;font-size:12px}
  button{padding:8px 14px;border-radius:10px;border:0;font-weight:700;cursor:pointer;margin-top:8px}
  .approve{background:#2ecc71;color:#000}
  .reject{background:#e74c3c;color:#fff}
  code{word-break:break-all;font-size:12px;color:#67c5ff}
</style>
</head>
<body>
<h1>⚙️ NoxVolt Admin — Withdrawal Requests</h1>
<div id="msg" class="muted"></div>
<div id="list"></div>

<script>
const SUPABASE_URL = "https://phyqkohgvzvmgawjzyia.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1PK7kV9Ew5ja82anz-fYLQ_ZO5SBivq";
const EDGE_FUNCTION = "noxvolt-api";

const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const initData = tg?.initData || "";

async function api(action, payload = {}) {
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${EDGE_FUNCTION}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_PUBLISHABLE_KEY },
    body: JSON.stringify({ action, initData, payload }),
  });
  const d = await r.json();
  if (!r.ok || d.ok === false) throw new Error(d.error || "Failed");
  return d;
}

async function load() {
  try {
    const d = await api("admin_list_withdrawals");
    const list = document.getElementById("list");
    list.innerHTML = "";
    if (!d.withdrawals || !d.withdrawals.length) {
      list.innerHTML = '<div class="card muted">No pending withdrawal requests.</div>';
      return;
    }
    for (const w of d.withdrawals) {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <div class="row"><b>${w.amount} NOXV</b><span class="muted">${w.status}</span></div>
        <div class="muted">User ID: ${w.user_id}</div>
        <div class="muted">Username: ${w.username || "—"}</div>
        <div class="muted">TON address: <code>${w.address}</code></div>
        <div class="muted">Date: ${new Date(w.created_at).toLocaleString()}</div>
      `;
      if (w.status === "pending") {
        const approve = document.createElement("button");
        approve.className = "approve"; approve.textContent = "✅ Mark as Paid";
        approve.onclick = async () => {
          await api("admin_mark_withdrawal", { id: w.id, status: "paid" });
          tg?.showAlert("Marked as paid.");
          load();
        };
        const reject = document.createElement("button");
        reject.className = "reject"; reject.textContent = "❌ Reject & Refund";
        reject.onclick = async () => {
          await api("admin_mark_withdrawal", { id: w.id, status: "rejected" });
          tg?.showAlert("Rejected. Balance refunded.");
          load();
        };
        el.append(approve, reject);
      }
      list.appendChild(el);
    }
  } catch (e) {
    document.getElementById("msg").textContent = e.message;
  }
}
load();
</script>
</body>
</html>
